name: Build Roblox Place

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Prettier check (formatação)
        run: npm run check:format

      - name: ESLint (roblox-ts oficial)
        run: npm run lint

      - name: roblox-ts build (TS -> Luau)
        run: npm run build

      - name: Instalar Rojo 7.7.0
        run: |
          curl -sL https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-linux-x86_64.zip -o /tmp/rojo.zip
          unzip -o /tmp/rojo.zip -d /tmp
          sudo mv /tmp/rojo /usr/local/bin/rojo
          rojo --version

      - name: Rojo build (.rbxlx)
        run: rojo build -o build.rbxlx

      - name: Upload place
        uses: actions/upload-artifact@v7
        with:
          name: place
          path: build.rbxlx
